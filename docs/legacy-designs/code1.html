<body class="bg-surface">

<div class="fixed inset-0 z-0 flex flex-col">
<!-- SideNav (Simulated via Shared Components Data) -->

<div class="px-6 mb-8">

<p class="font-label-sm text-label-sm text-outline-variant opacity-70">SALTWATER ELECTRICITY</p>
</div>
<nav class="flex-1">
<div class="text-primary-fixed font-bold border-l-4 border-primary-fixed bg-surface-variant/10 flex items-center gap-4 px-6 py-3 cursor-pointer">
<span class="material-symbols-outlined">dashboard</span>

</div>
<div class="text-outline-variant hover:text-surface-bright flex items-center gap-4 px-6 py-3 cursor-pointer transition-all duration-200">
<span class="material-symbols-outlined">monitoring</span>
<span class="font-label-md text-label-md">Realtime Monitor</span>
</div>
<div class="text-outline-variant hover:text-surface-bright flex items-center gap-4 px-6 py-3 cursor-pointer transition-all duration-200">
<span class="material-symbols-outlined">group</span>
<span class="font-label-md text-label-md">User Management</span>
</div>

</aside>
<!-- TopNavBar (Simulated via Shared Components Data) -->
<header class="flex justify-between items-center ml-64 px-8 py-4 w-[calc(100%-16rem)] bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 z-10">

</div>
<div class="flex items-center gap-6">
<span class="material-symbols-outlined text-secondary cursor-pointer">notifications</span>
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a middle-aged male administrator in a clean, high-key studio setting. He wears a neutral-toned professional shirt, suggesting a corporate yet tech-savvy environment. The lighting is soft and directional, creating a polished, authoritative look consistent with a high-end SaaS dashboard aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-cYSII7RWk-Oxy2GApggcowYG1sIfqPQXQaSsvx4xddo9nOwaeCG51Avt1JzmJqm3tnjpDl3wEA3mxDg_HBv7zV2sz4W3N2TuqLIVMP_oNQBlhIqUPQyPeRk6ZkHIJiaUG-CP9YIprugSrRQeQ-HK7nEA3kf4xLBZJbkn9SuC3_pRhiw84nSJ9m7NtyZ9g4EQNipPLLmuBW6G5WiNxadELYM_ub5Jsmy9UtN2ybQThQBUKd-W8mwwbgdSOf1rtZ2AuXjuHjgYjeo">

<!-- Page Content Placeholder -->
<main class="ml-64 p-12 bg-surface-container-low min-h-screen">
<div class="max-w-container-max mx-auto">

<div class="col-span-12 bg-white p-8 rounded-[24px] linear-shadow border border-outline-variant/20">

                            Background Dashboard Content
                        </div>
</div>
</div>
</div>

</div>
<!-- DENIED REQUEST MODAL OVERLAY -->
<div class="fixed inset-0 z-50 flex items-center justify-center glass-overlay p-4" id="denied-modal">
<div class="bg-surface-container-lowest w-full max-w-md rounded-[24px] linear-shadow overflow-hidden transform transition-all duration-300 scale-100 flex flex-col opacity-100 translate-y-0">
<div class="p-8">
<!-- Top Icon: Circular Decline -->
<div class="mb-6 flex">
<div class="w-14 h-14 rounded-full flex items-center justify-center bg-error-container/30 border border-error/20 shadow-sm">
<span class="material-symbols-outlined !text-3xl text-error" style="font-variation-settings: &quot;FILL&quot; 0, &quot;wght&quot; 600;">close</span>
</div>
</div>
<!-- Title & Context -->
<div class="space-y-1 mb-8">
<h3 class="font-headline-md text-headline-md text-on-background font-bold">Request <span class="text-error">Denied!</span></h3>
<div class="flex items-center gap-2 py-1 px-3 bg-error-container/30 rounded-full w-fit">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Resident:</span>
<span class="font-label-sm text-label-sm text-on-surface font-bold">Jasmin Hernandez</span>
</div>
</div>
<!-- Text Box: Reason for Decline -->
<div class="space-y-3">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="decline-reason">Reason for Decline</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant/40 rounded-xl p-4 font-body-sm text-on-surface focus:ring-2 focus:ring-error/20 focus:border-error transition-all outline-none resize-none placeholder:text-outline/50" id="decline-reason" placeholder="Please provide a justification for declining this electricity monitoring access request..." rows="4"></textarea>
</div>
</div>
<!-- Footer: Actions -->
<div class="px-8 pb-10 flex gap-4 items-center justify-center">
<button class="flex-1 py-4 px-6 bg-white border border-outline-variant text-secondary font-label-md text-label-md hover:bg-surface-container-low transition-all duration-200 active:scale-[0.98] rounded-lg" onclick="document.getElementById('denied-modal').style.display='none'">
                    Cancel
                </button>
<button class="flex-1 py-4 px-6 bg-error text-on-error font-label-md text-label-md font-bold shadow-lg shadow-error/10 hover:brightness-110 transition-all duration-200 active:scale-[0.98] rounded-lg">
                    Decline Request
                </button>
</div>
</div>
</div>
<script>
        // Simple micro-interaction for the modal emergence
        window.addEventListener('load', () => {
            const modal = document.querySelector('#denied-modal > div');
            modal.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'translate-y-4');
                modal.classList.add('opacity-100', 'translate-y-0');
            }, 100);
        });

        // Toggle focus state aesthetics
        const textarea = document.getElementById('decline-reason');
        textarea.addEventListener('focus', () => {
            textarea.parentElement.previousElementSibling.classList.add('text-error');
        });
        textarea.addEventListener('blur', () => {
            textarea.parentElement.previousElementSibling.classList.remove('text-error');
        });
    </script>
