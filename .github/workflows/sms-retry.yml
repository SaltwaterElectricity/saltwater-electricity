name: SMS Outbox Retry
on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch: # Allow manual trigger

jobs:
  retry-outbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Retry Endpoint
        run: |
          curl -X POST \"https://saltwater-electricity.vercel.app/api/sms/retry_outbox\" \
          -H \"x-cron-secret: \${{ secrets.SMS_RETRY_CRON_SECRET }}\" \
          -H \"Content-Type: application/json\" \
          -d '{}' -s -o /dev/null -w \"%{http_code}\"
