name: Secret and Environment File Guard

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  secret-guard:
    name: Reject tracked environment files and likely secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | awk '
            {
              n = split($0, parts, "/")
              name = parts[n]
              if (name ~ /^\.env($|\.)/ &&
                  name != ".env.example" &&
                  name !~ /^\.env\..*\.example$/) print $0
            }')"
          if [[ -n "$bad_files" ]]; then
            echo "::error::Prohibited tracked environment files found (paths only):"
            printf '%s\n' "$bad_files"
            exit 1
          fi
          echo "No prohibited tracked environment files found."

      - name: Scan changed files for likely credentials
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No prior commit available; scanning tracked files for likely credentials."
            mapfile -t files < <(git ls-files)
          else
            mapfile -t files < <(git diff --name-only "$base" "$HEAD_SHA")
          fi

          failed=0
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            if ! grep -Iq . "$file"; then
              continue
            fi
            if grep -Eq -- 'AIza[0-9A-Za-z_-]{20,}|-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}' "$file"; then
              echo "::error file=$file::Potential credential pattern detected; value intentionally redacted."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Remove the credential or load it from a secret manager/environment variable."
            exit 1
          fi
          echo "No configured credential patterns found in changed files."
