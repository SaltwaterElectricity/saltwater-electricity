            box-shadow: 0 0 15px rgba(0, 193, 253, 0.3);

</div>

<!-- Brand Logo Header -->

<div class="w-24 h-24 rounded-full bg-tertiary-fixed flex items-center justify-center text-tertiary shadow-[0_0_30px_rgba(66,253,211,0.4)]">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Subtle Orbiting Particle -->
<div class="absolute inset-0 border-2 border-dashed border-tertiary-fixed/30 rounded-full animate-[spin_10s_linear_infinite]"></div>
</div>

</div>

<span class="text-primary font-bold">85%</span>
